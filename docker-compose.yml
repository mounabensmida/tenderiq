services:
  postgres:
    image: postgres:16
    container_name: tenderiq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tenderiq-qdrant
    ports:
      - "6333:6333" # API + tableau de bord web
    volumes:
      - qdrantdata:/qdrant/storage

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tenderiq-mailpit
    ports:
      - "1025:1025" # SMTP : là où on « envoie » les e-mails
      - "8025:8025" # interface web pour lire les e-mails

volumes:
  pgdata:
  qdrantdata:
