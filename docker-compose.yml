services:
  postgres:
    image: postgres:16
    container_name: tenderiq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tenderiq-qdrant
    ports:
      - "6333:6333" # API + tableau de bord web
    volumes:
      - qdrantdata:/qdrant/storage

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tenderiq-mailpit
    ports:
      - "1025:1025" # SMTP : là où on « envoie » les e-mails
      - "8025:8025" # interface web pour lire les e-mails

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: tenderiq-api:latest
    container_name: tenderiq-api
    env_file: .env
    environment:                                   # dans Docker, les services s'appellent par leur NOM
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      SMTP_HOST: mailpit
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama tourne sur Windows, hors Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tenderiq-prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre l'API qui tourne sur Windows
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tenderiq-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/monitoring/grafana:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"

volumes:
  pgdata:
  qdrantdata:
