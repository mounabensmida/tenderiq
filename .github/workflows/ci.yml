name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:                 # bouton "Run workflow" dans l'onglet Actions

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                      # récupère le code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Lint (style et erreurs simples)
        run: ruff check backend
      - run: cp .env.example .env
      - name: Tests unitaires
        run: pytest -m "not integration" -v

  quality-gate:
    needs: tests                                       # ne démarre que si "tests" est vert
    runs-on: ubuntu-latest
    services:                                          # des conteneurs à côté du job, comme Compose
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tenderiq
          POSTGRES_USER: tenderiq
          POSTGRES_PASSWORD: change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderiq" --health-interval 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      LLM_MODEL: qwen2.5:1.5b                          # petit modèle : la CI n'a pas de GPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cp .env.example .env
      - name: Installer Ollama et les modèles
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 5
          ollama pull qwen2.5:1.5b
          ollama pull nomic-embed-text
      - name: Préparer la base et l'index
        run: |
          PGPASSWORD=change_me psql -h localhost -U tenderiq -d tenderiq -f db/migrations/001_schema.sql
          python -m backend.scraper.generate_samples
          python -m backend.pipeline.run --no-llm --no-dedup
          python -m backend.rag.ingest
      - name: Évaluations (bloquant sous le seuil)
        run: python -m evals.run_evals
      - name: Tests de sécurité LLM
        run: pytest -m integration -v
      - uses: actions/upload-artifact@v4
        if: always()                                   # même en cas d'échec, pour comprendre pourquoi
        with:
          name: eval-report
          path: evals/report.json

  security-scan:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tenderiq-api:ci -f infra/docker/backend.Dockerfile .
      - name: Scan Trivy (échoue si faille CRITIQUE corrigeable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 tenderiq-api:ci

  deploy:
    needs: [quality-gate, security-scan]               # le garde-fou : les deux doivent être verts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}        # fourni automatiquement par GitHub
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tenderiq-api:latest