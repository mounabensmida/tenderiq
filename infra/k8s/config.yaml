apiVersion: v1
kind: ConfigMap
metadata:
  name: tenderiq-config
  namespace: tenderiq
data:
  POSTGRES_HOST: postgres            # = le nom du Service postgres ci-dessous
  QDRANT_URL: http://qdrant:6333
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  LLM_MODEL: qwen2.5:3b
---
apiVersion: v1
kind: Secret
metadata:
  name: tenderiq-secrets
  namespace: tenderiq
type: Opaque
stringData:                          # Kubernetes les encode lui-même (en vrai : un gestionnaire de secrets)
  POSTGRES_PASSWORD: change_me
  POSTGRES_READONLY_PASSWORD: change_me_ro
  JWT_SECRET: change_me_long_random_string