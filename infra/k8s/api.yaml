apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tenderiq
spec:
  replicas: 1                         # voir la remarque ci-dessous avant de passer à 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: tenderiq-api:latest
          imagePullPolicy: IfNotPresent      # utilise l'image chargée par "kind load"
          envFrom:
            - configMapRef: { name: tenderiq-config }
            - secretRef: { name: tenderiq-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe:                    # Kubernetes n'envoie du trafic que si /health répond
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits: { memory: "1Gi", cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tenderiq
spec:
  selector: { app: api }
  ports: [{ port: 8000 }]