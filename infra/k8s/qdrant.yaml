apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: tenderiq
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports: [{ containerPort: 6333 }]
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: tenderiq
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333 }]